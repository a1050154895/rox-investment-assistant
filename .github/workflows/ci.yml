name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 app/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          find static/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check view initialization
        run: |
          set -e
          for f in static/js/views/*.js; do
            if grep -q 'ROX\.views\.' "$f" && ! grep -q 'ROX\.views = ROX\.views || {}' "$f"; then
              echo "::error file=$f::视图文件引用了 ROX.views 但未先初始化 ROX.views"
              exit 1
            fi
          done
          echo "view initialization OK"

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "setuptools>=83.0.0"
          pip install -r requirements.txt
          pip install pip-audit

      - name: Audit dependencies
        run: pip-audit


  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        env:
          ENVIRONMENT: test
          E2E_SECRET_KEY: ci-e2e-key-32bytes-for-tests-only
          PYTHON_BIN: python
        run: npm run test:e2e


  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Start application
        env:
          ENVIRONMENT: test
          E2E_SECRET_KEY: ci-e2e-key-32bytes-for-tests-only
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8783 > /tmp/rox-lighthouse.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8783/health && break || sleep 1; done

      - name: Run Lighthouse mobile audit
        env:
          LH_PORT: 8783
        run: npm run audit:mobile

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-report
          path: lighthouse-report/

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
