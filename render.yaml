# Render Blueprint —— 一键部署（含持久化 PostgreSQL）。
# 部署方式：Render 控制台 → New → Blueprint → 选仓库 → Apply。
# 会自动创建一个免费 PostgreSQL 实例并把其连接串写入 DATABASE_URL，
# 从而彻底解决「免费实例重启后 SQLite 被清空导致注册账号丢失」的问题。
databases:
  - name: rox-db
    databaseName: rox
    plan: free
    # 出于安全，仅允许同账号下服务访问（留空即默认行为）

services:
  - type: web
    name: rox-investment-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Render 默认 Python 版本可能过新导致依赖兼容问题，固定为 3.11.9
      - key: PYTHON_VERSION
        value: 3.11.9
      # 会话/令牌签名密钥，自动生成后持久保存，避免重启使旧登录令牌失效
      - key: SECRET_KEY
        generateValue: true
      # 自动注入上面声明的 PostgreSQL 连接串，使账号数据跨重启持久化
      - key: DATABASE_URL
        fromDatabase:
          name: rox-db
          property: connectionString
      # 可选：全局 AI 服务密钥（也可登录后在「设置 → AI模型」中单独填写）
      - key: AI_API_KEY
        sync: false
      # 找回密码/邮箱验证邮件通道（SMTP）。未配置时功能如实提示"未配置"，
      # 在 Render 控制台填入后即可启用自助找回。
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
