services:
  - type: web
    name: rox-investment-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      # 注意：Render 手动创建的服务不会读取本文件的环境变量，
      # 需在 Render 控制台 Environment 中手动添加 PYTHON_VERSION=3.11.9，
      # 否则默认 Python 3.14 可能触发依赖兼容问题。
      - key: PYTHON_VERSION
        value: 3.11.9
      # 生产必须设置独立密钥（不设置则每次重启生成新密钥，旧登录全部失效）
      - key: SECRET_KEY
        sync: false
      # 生产建议连接 PostgreSQL：在 Render 新建 PostgreSQL 实例，把其 Internal Database URL 填入此项。
      # 不设置时自动降级为 SQLite（Render 免费实例重启后文件会丢失，正式数据务必用 PostgreSQL）
      - key: DATABASE_URL
        sync: false
      # 可选：全局 AI 服务配置（也可由用户登录后在「设置 → AI模型」中自行填写）
      - key: AI_API_KEY
        sync: false
